tags:
  - Auth
security: []
summary: Send email to reset a password
operationId: sendResetEmail
description: Sends a password reset link to the user's registered email address.
  This endpoint does not require authentication.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: The email address associated with the user's account
            type: string
            example: 'princessD@gmail.com'
responses:
  '200':
    description: Reset password email successfully sent
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email has been successfully sent.
            data:
              type: object
              description: Additional response data (optional)
  '500':
    $ref: ../../../components/responses/500.yaml
