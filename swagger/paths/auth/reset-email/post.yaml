tags:
  - Auth
security: []
summary: Reset password using token
operationId: resetEmail
description: Resets the user's password using a valid reset token received via email.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            description: The reset token sent to the user's email address
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2ODcxMTE0MjEzNzNmZjlkZWI1MTFjN2YiLCJlbWFpbCI6InJ5YmFsa295dWxpaWE0QHVrci5uZXQiLCJpYXQiOjE3NTI1MDkxNzYsImV4cCI6MTc1MjUwOTQ3Nn0.T2RhkW4oDil8o1v6GjvyTNGNY99SNYHDKvsp0Ppksco'
          password:
            description: The new password to set for the user
            type: string
            example: '987654321'
responses:
  '200':
    description: Password has been successfully reset
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
              description: Confirmation message
            data:
              type: object
              description: Additional response data (optional)
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
