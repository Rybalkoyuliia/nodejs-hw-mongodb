tags:
  - Contacts
summary: Update contact field by id
operationId: patchContact
description: 'Update contact field by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../../components/schemas/updContact.yaml'
responses:
  '200':
    description: 'Update contact field by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: ../../../components/schemas/contact.yaml
  '401':
    description: 'Unauthorized'
    $ref: ../../../components/responses/401.yaml
  '404':
    description: 'NotFound'
    $ref: ../../../components/responses/404.yaml
